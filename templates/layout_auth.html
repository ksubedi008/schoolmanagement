<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login | School Management System{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    
    <!-- Theme Toggle positioned absolute for auth page -->
    <div style="position: absolute; top: 20px; left: 20px; z-index: 100;">
        <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle Theme">
            <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
    </div>

    <div class="auth-wrapper">
        <div class="auth-left">
            {% block content %}{% endblock %}
        </div>
        
        <div class="auth-right" style="position: relative; overflow: hidden;">
            <!-- Decorative Background Elements -->
            <div style="position: absolute; width: 100%; height: 100%; overflow: hidden; opacity: 0.1;">
                <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width: 100%; height: 100%;">
                    <polygon fill="white" points="0,100 100,0 100,100"/>
                </svg>
            </div>
            
            <div style="position: absolute; top: -10%; right: -10%; width: 400px; height: 400px; background: rgba(255, 255, 255, 0.1); border-radius: 50%; filter: blur(60px);"></div>
            <div style="position: absolute; bottom: -10%; left: -10%; width: 300px; height: 300px; background: rgba(0, 0, 0, 0.15); border-radius: 50%; filter: blur(60px);"></div>

            <div style="z-index: 1; max-width: 480px; text-align: left; padding: 2rem;">
                <div id="carousel-container" style="min-height: 250px; display: flex; flex-direction: column; justify-content: center; transition: opacity 0.5s ease;">
                    <div id="carousel-badge" style="display: inline-flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); padding: 8px 16px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.3); margin-bottom: 2rem; width: fit-content; color: white;">
                        <svg id="carousel-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                        <span id="carousel-badge-text" style="font-weight: 600; font-size: 0.85rem; letter-spacing: 0.5px; text-transform: uppercase;">Fee Management</span>
                    </div>

                    <h1 id="carousel-title" style="font-size: 2.8rem; font-weight: 800; margin-bottom: 1.5rem; line-height: 1.2; color: white;">Empower Your Education</h1>
                    <p id="carousel-text" style="font-size: 1.125rem; color: rgba(255, 255, 255, 0.9); line-height: 1.6;">
                        The all-in-one School Management System designed for seamless administration, better learning, and stronger connections.
                    </p>
                </div>
                
                <div style="margin-top: 3rem; display: flex; gap: 1rem; align-items: center;" id="carousel-indicators">
                    <button class="indicator" data-index="0" style="width: 50px; height: 4px; background: white; border-radius: 2px; border: none; cursor: pointer; transition: all 0.3s ease;"></button>
                    <button class="indicator" data-index="1" style="width: 50px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; border: none; cursor: pointer; transition: all 0.3s ease;"></button>
                    <button class="indicator" data-index="2" style="width: 50px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; border: none; cursor: pointer; transition: all 0.3s ease;"></button>
                </div>
            </div>
            
            <script>
                const slides = [
                    {
                        title: "Empower Your Education",
                        text: "The all-in-one School Management System designed for seamless administration, better learning, and stronger connections.",
                        badge: "Overview",
                        icon: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>'
                    },
                    {
                        title: "Real-time Timetables",
                        text: "Keep students and staff updated with live schedules, instant substitution alerts, and comprehensive attendance tracking.",
                        badge: "Scheduling",
                        icon: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>'
                    },
                    {
                        title: "Granular Security",
                        text: "Enterprise-grade role-based access control ensures that sensitive data is only accessible to authorized personnel.",
                        badge: "9-Role RBAC",
                        icon: '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>'
                    }
                ];

                let currentSlide = 0;
                const container = document.getElementById('carousel-container');
                const titleEl = document.getElementById('carousel-title');
                const textEl = document.getElementById('carousel-text');
                const badgeTextEl = document.getElementById('carousel-badge-text');
                const iconEl = document.getElementById('carousel-icon');
                const indicators = document.querySelectorAll('.indicator');

                function updateSlide(index) {
                    container.style.opacity = 0;
                    
                    setTimeout(() => {
                        titleEl.textContent = slides[index].title;
                        textEl.textContent = slides[index].text;
                        badgeTextEl.textContent = slides[index].badge;
                        iconEl.innerHTML = slides[index].icon;
                        
                        indicators.forEach((ind, i) => {
                            ind.style.background = i === index ? 'white' : 'rgba(255, 255, 255, 0.3)';
                        });
                        
                        container.style.opacity = 1;
                        currentSlide = index;
                    }, 500);
                }

                setInterval(() => {
                    let nextSlide = (currentSlide + 1) % slides.length;
                    updateSlide(nextSlide);
                }, 5000);

                indicators.forEach(ind => {
                    ind.addEventListener('click', (e) => {
                        const index = parseInt(e.target.getAttribute('data-index'));
                        updateSlide(index);
                    });
                });
            </script>
        </div>
    </div>

    <script src="{% static 'js/app.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentThemeAttr = document.documentElement.getAttribute('data-theme');
            const moon = document.getElementById('moon-icon');
            const sun = document.getElementById('sun-icon');
            if (currentThemeAttr === 'dark') {
                sun.style.display = 'block';
            } else {
                moon.style.display = 'block';
            }
        });
    </script>
</body>
</html>
