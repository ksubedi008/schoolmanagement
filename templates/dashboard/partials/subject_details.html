<div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
    <div style="width: 56px; height: 56px; border-radius: 12px; background: rgba(59, 130, 246, 0.1); color: #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </div>
    <div>
        <h2 style="margin: 0; font-size: 1.25rem; color: var(--text-primary);">Assign Subject: {{ subject.name }} ({{ subject.code|default:"No Code" }})</h2>
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Select the classes this subject applies to</div>
    </div>
</div>

<form id="assignSubjectForm" onsubmit="submitSubjectAssignment(event, {{ subject.id }})">
    <div class="card" style="box-shadow: none; border: 1px solid var(--border-color); margin-bottom: 2rem;">
        <h4 style="font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 1rem 0;">Available Classes</h4>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem;">
            {% for ac_class in all_classes %}
            <label style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s;" class="hover-row">
                <input type="checkbox" name="classes" value="{{ ac_class.id }}" {% if ac_class in subject_classes %}checked{% endif %} style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary-color);">
                <span style="font-size: 0.95rem; font-weight: 500; color: var(--text-primary);">{{ ac_class.name }}</span>
            </label>
            {% endfor %}
        </div>
    </div>
    
    <div style="display: flex; gap: 1rem;">
        <button type="button" class="btn btn-outline" style="flex: 1;" onclick="closeSidePanel()">Cancel</button>
        <button type="submit" class="btn btn-primary" style="flex: 2;">Save Assignments</button>
    </div>
</form>

<script>
    function submitSubjectAssignment(event, subjectId) {
        event.preventDefault();
        const form = event.target;
        const checkboxes = form.querySelectorAll('input[name="classes"]:checked');
        const classIds = Array.from(checkboxes).map(cb => cb.value);
        
        // Extract CSRF token
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';

        // Use our fetch utility or standard fetch
        fetch(`/dashboard/admin/academic/subject/assign-classes/${subjectId}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({ class_ids: classIds })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                if (typeof Toast !== 'undefined') {
                    Toast.show('Subject successfully assigned to selected classes.');
                }
                closeSidePanel();
            } else {
                if (typeof Toast !== 'undefined') {
                    Toast.show(data.error || 'An error occurred.', 'error');
                }
            }
        })
        .catch(error => {
            console.error('Error:', error);
            if (typeof Toast !== 'undefined') {
                Toast.show('Failed to save assignments.', 'error');
            }
        });
    }
</script>
