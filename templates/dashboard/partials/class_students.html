<div style="margin-bottom: 1rem;">
    <select id="sectionStudentFilter" onchange="filterClassStudents(this.value)" style="padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-primary);">
        <option value="all">All Sections</option>
        {% for section in sections %}
        <option value="{{ section.id }}">Section {{ section.name }}</option>
        {% endfor %}
    </select>
</div>

<div style="overflow-x: auto;">
    <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
        <thead>
            <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-secondary); text-align: left;">
                <th style="padding: 0.5rem;">Roll No</th>
                <th style="padding: 0.5rem;">Name</th>
                <th style="padding: 0.5rem;">Section</th>
                <th style="padding: 0.5rem; text-align: right;">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr class="student-row-filter" data-section="{{ student.current_section_id }}" id="class-student-row-{{ student.id }}" style="border-bottom: 1px solid var(--border-color);">
                <td style="padding: 0.5rem;">{{ student.roll_number|default:"-" }}</td>
                <td style="padding: 0.5rem;">
                    <div style="font-weight: 500;">{{ student.first_name }} {{ student.last_name }}</div>
                </td>
                <td style="padding: 0.5rem;">{{ student.current_section.name|default:"-" }}</td>
                <td style="padding: 0.5rem; text-align: right;">
                    <a href="{% url 'dashboard:admin_students' %}?edit={{ student.id }}" target="_blank" class="btn" style="padding: 0.25rem; color: var(--text-secondary); background: none; border: none;" title="Edit Student">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </a>
                    <button class="btn" style="padding: 0.25rem; color: #dc2626; background: none; border: none;" onclick="ModularTable.triggerDelete('{% url 'dashboard:soft_delete_student' student.id %}', '{{ student.first_name }} {{ student.last_name }}', 'class-student-row-{{ student.id }}'); event.stopPropagation();" title="Delete Student">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" style="padding: 1rem; text-align: center; color: var(--text-secondary);">No students enrolled in this class.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    function filterClassStudents(sectionId) {
        document.querySelectorAll('.student-row-filter').forEach(row => {
            if (sectionId === 'all' || row.dataset.section === sectionId) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }
</script>
