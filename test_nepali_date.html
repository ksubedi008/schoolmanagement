<!DOCTYPE html>
<html>
<head>
    <link href="https://nepalidatepicker.sajanmaharjan.com.np/nepali.datepicker/css/nepali.datepicker.v4.0.1.min.css" rel="stylesheet" type="text/css"/>
    <script src="https://nepalidatepicker.sajanmaharjan.com.np/nepali.datepicker/js/nepali.datepicker.v4.0.1.min.js" type="text/javascript"></script>
</head>
<body>
    <input type="text" id="test_date" class="nepali-datepicker">
    <div id="output"></div>
    <script>
        window.onload = function() {
            var input = document.getElementById("test_date");
            input.nepaliDatePicker({
                onChange: function() {
                    var val = input.value;
                    var adObj = NepaliFunctions.BS2AD(val);
                    var output = "BS: " + val + " | AD Object: " + JSON.stringify(adObj);
                    
                    var adDateString = adObj.year + "-" + String(adObj.month).padStart(2, '0') + "-" + String(adObj.day).padStart(2, '0');
                    output += " | AD String: " + adDateString;

                    document.getElementById("output").innerText = output;
                }
            });
            
            // Also let's output some tests
            let t1 = NepaliFunctions.BS2AD("2080-01-01");
            let t2 = NepaliFunctions.AD2BS("2023-04-14");
            console.log(t1, t2);
            document.getElementById("output").innerText += "\\n" + JSON.stringify(t1) + " | " + JSON.stringify(t2);
        };
    </script>
</body>
</html>
